name: android
on:
  push: {paths: ["apps/android/**", "shared/**", ".github/workflows/android.yml"]}
  pull_request: {paths: ["apps/android/**", "shared/**"]}
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/android}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
