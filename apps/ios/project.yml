name: CharacterVerse
options:
  bundleIdPrefix: ai.characterverse
  deploymentTarget: {iOS: "17.0"}
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CharacterVerse:
    type: application
    platform: iOS
    sources:
      - path: CharacterVerse
      - path: ../../shared/asset-manifests/asset_manifest_v1.json
        buildPhase: resources
      - path: ../../shared/asset-manifests/procedural_parts_v1.json
        buildPhase: resources
    info:
      path: CharacterVerse/Resources/Info.plist
      properties:
        CFBundleDisplayName: CharacterVerse
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {UIColorName: ""}
        UIApplicationSceneManifest: {UIApplicationSupportsMultipleScenes: false}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CVAPIBaseURL: "http://localhost:8000"
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.characterverse.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  CharacterVerseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CharacterVerseTests
      - path: ../../shared/fixtures
        buildPhase: resources
      - path: ../../shared/asset-manifests/asset_manifest_v1.json
        buildPhase: resources
      - path: ../../shared/asset-manifests/procedural_parts_v1.json
        buildPhase: resources
    dependencies: [{target: CharacterVerse}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CharacterVerse.app/CharacterVerse
schemes:
  CharacterVerse:
    build: {targets: {CharacterVerse: all, CharacterVerseTests: [test]}}
    test: {targets: [CharacterVerseTests], gatherCoverageData: true}
    run: {config: Debug}
